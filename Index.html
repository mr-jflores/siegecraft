function renderForge(){
  const mastered=GREEK_FORGE.filter(x=>activeUser.forge[x.key]).length;
  $('hub').innerHTML=renderHubHeader()+`<div class="hub-container"><button class="plain-btn hub-back" id="backForge">← HOME</button><p class="hub-eyebrow">The Forge / Civilizations</p><h1 class="hub-display">FORGE YOUR LEGACY</h1><p class="hub-lead">Greece is your first civilization. Begin Conquest with hoplites; complete Greek mathematics trials to unlock the rest of your military roster. Future civilizations will bring new maps and units.</p><div class="hub-kpis"><div class="hub-kpi"><b>GREECE</b><span>CURRENT CIVILIZATION</span></div><div class="hub-kpi"><b>${mastered}/3</b><span>TRIALS MASTERED</span></div></div><h2 class="hub-section-title" style="margin-top:30px">Ancient Greece · Mathematical heritage</h2><div class="forge-path">${GREEK_FORGE.map((s,i)=>{const unlocked=activeUser.forge[s.key],progress=activeUser.forgeStep[s.key]||0;return `<div class="forge-card ${unlocked?'done':''}"><div class="forge-icon">${s.symbol}</div><div class="forge-tag">TRIAL ${i+1} · ${s.tag}</div><h3>${s.title}</h3><p>${s.description}</p><div class="hub-level">${unlocked?'✓ '+s.unit.toUpperCase()+' UNLOCKED':progress+'/3 CORRECT · UNLOCK '+s.unit.toUpperCase()}</div><button class="${unlocked?'muted-btn':'gold-btn'}" data-forge="${s.key}">${unlocked?'REVIEW TRIAL':'BEGIN TRIAL'}</button></div>`;}).join('')}</div><h2 class="hub-section-title" style="margin-top:38px">Future civilizations</h2><div class="future-civ">${['Egypt','Babylon','Assyria','China','Islamic Golden Age','Mali','Japan','Aztecs'].map(c=>`<div>${c}<small>COMING SOON</small></div>`).join('')}</div></div>`;
  $('backForge').onclick=()=>showHub('home');$('hub').querySelectorAll('[data-forge]').forEach(b=>b.onclick=()=>startForge(b.dataset.forge));
}
function startForge(key){
  if(!FORGE_QUESTIONS[key])return;
  forgeRun={key,step:activeUser.forge[key]?0:Math.max(0,Math.min(2,activeUser.forgeStep[key]||0)),hint:false,locked:false};showHub('forgeQuestion');
}
function forgeAnswers(q){const candidates=[q.ans,q.ans+8,q.ans-5,q.ans+12,q.ans-10,q.ans+4].filter(n=>Number.isInteger(n)&&n>0);const vals=[...new Set(candidates)].slice(0,4);while(vals.length<4)vals.push(vals[vals.length-1]+7);return shuffle(vals);}
function forgeDiagram(key,q){
  if(key==='archer'){
    const right=q.a===90;
    const tip=right?55:170;
    const corner=right?`<path d="M56 128 V114 H42" fill="none" stroke="#987949" stroke-width="2"/>`:'';
    return `<svg viewBox="0 0 320 150" aria-label="Triangle with ${q.a} degrees and ${q.b} degrees marked at the two bottom corners"><path d="M42 128 L285 128 L${tip} 19 Z" fill="#e1ddc4" stroke="#526c62" stroke-width="4"/>${corner}<text x="${right?66:65}" y="116" fill="#9a583f" font-size="17" font-weight="bold">${q.a}°</text><text x="239" y="116" fill="#9a583f" font-size="17" font-weight="bold">${q.b}°</text><text x="${right?66:170}" y="48" text-anchor="middle" fill="#a54c3b" font-size="20" font-weight="bold">?°</text></svg>`;
  }
  if(key==='cavalry')return `<svg viewBox="0 0 320 150" aria-label="Right triangle with legs ${q.a} and ${q.b}"><path d="M40 127 H280 V20 Z" fill="#dedfca" stroke="#556d62" stroke-width="4"/><path d="M260 127 V107 H280" fill="none" stroke="#94754d" stroke-width="2"/><text x="156" y="145" fill="#475e57" font-size="16">${q.a} paces</text><text x="287" y="87" fill="#475e57" font-size="15">${q.b}</text><text x="142" y="56" fill="#a65c41" font-size="18" font-weight="bold">? paces</text></svg>`;
  if(q.shape==='rect')return `<svg viewBox="0 0 320 150" aria-label="Rectangle with sides ${q.a} and ${q.b}"><rect x="69" y="25" width="176" height="99" fill="#d5ddc6" stroke="#597063" stroke-width="4"/><text x="140" y="143" font-size="17" fill="#4d6054">${q.a} paces</text><text x="246" y="82" font-size="17" fill="#4d6054">${q.b}</text></svg>`;
  return `<svg viewBox="0 0 320 150" aria-label="Triangle with base ${q.a} and height ${q.b}"><path d="M52 126 L276 126 L167 22 Z" fill="#dbe0c6" stroke="#597063" stroke-width="4"/><path d="M167 22 V126" stroke="#aa624b" stroke-width="2" stroke-dasharray="5 4"/><text x="128" y="145" fill="#52675c" font-size="16">base ${q.a}</text><text x="176" y="81" fill="#a75b43" font-size="16">height ${q.b}</text></svg>`;
}
// Forge calculation helpers: local to the question and never change grading or unlocks.
function forgeGuidedHTML(q){
  return `<section class="forge-guided" id="forgeGuided" aria-label="Guided Pythagorean workbench">
    <div class="forge-guide-head"><strong>Math Workbench</strong><small id="forgeStepNumber">STEP 1 OF 4</small></div>
    <div class="forge-formula" aria-label="Pythagorean theorem">a² + b² = c²</div>
    <div class="forge-step-track" id="forgeStepTrack">
      <div class="forge-step-tag active">1 · ASSIGN</div><div class="forge-step-tag">2 · SQUARE</div><div class="forge-step-tag">3 · ADD</div><div class="forge-step-tag">4 · ROOT</div>
    </div>
    <div class="forge-stage" id="forgeStage"></div>
    <div class="forge-guide-actions"><button class="forge-next" id="forgeNext" type="button" disabled>NEXT →</button></div>
    <details class="forge-reference" id="forgeRootDetails"><summary>Squares & square roots · Optional reference (1–25)</summary>
      <div class="forge-root-body"><p class="forge-mini-note">Need help squaring a number or finding its root? Use the chart. Nothing is calculated for you.</p>
      <div class="forge-squares">${Array.from({length:25},(_,i)=>`<div class="square-ref">${i+1}² = ${(i+1)*(i+1)}</div>`).join('')}</div>
      <p class="forge-mini-note">Example: 5² = 25 also tells you that √25 = 5.</p></div>
    </details>
  </section>`;
}
function bindForgeGuided(key,q){
  if(key!=='cavalry')return;
  let stage=0;
  const right=[q.a,q.b,q.a*q.a,q.b*q.b,q.a*q.a+q.b*q.b,q.ans];
  const area=$('forgeStage'),next=$('forgeNext'),labels=['1 · ASSIGN','2 · SQUARE','3 · ADD','4 · ROOT'];
  const blank=(id,label,aria='')=>`<span class="forge-entry"><label>${label}<input id="${id}" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="4" aria-label="${aria||label}" placeholder="?" /></label></span>`;
  const update=()=>{
    const inputs=[...area.querySelectorAll('input[data-expected]')];
    const valid=inputs.length>0&&inputs.every(input=>/^\d+$/.test(input.value.trim())&&Number(input.value.trim())===Number(input.dataset.expected));
    inputs.forEach(input=>{
      const entered=input.value.trim();
      input.classList.toggle('is-correct',entered!==''&&/^\d+$/.test(entered)&&Number(entered)===Number(input.dataset.expected));
      input.classList.toggle('is-wrong',entered!==''&&(!/^\d+$/.test(entered)||Number(entered)!==Number(input.dataset.expected)));
    });
    next.disabled=!valid;
    const feedback=$('forgeStageStatus');
    if(feedback){feedback.className='forge-stage-status'+(valid?' ready':'');feedback.textContent=valid?'✓ Correct. You can continue.':'Fill in the blanks. The next step opens when all entries are correct.';}
  };
  const draw=()=>{
    $('forgeStepNumber').textContent=`STEP ${stage+1} OF 4`;
    [...$('forgeStepTrack').children].forEach((el,i)=>{el.classList.toggle('active',i===stage);el.classList.toggle('done',i<stage);el.textContent=(i<stage?'✓ ': '')+labels[i];});
    if(stage===0){
      area.innerHTML=`<p class="forge-stage-prompt">Step 1 · Identify the two shorter sides.</p>
        <p class="forge-stage-help">Look at the diagram. Enter the value for side A and the value for side B.</p>
        <div class="forge-entry-pair">${blank('forgeGuidedA','Assign side A (paces)')}${blank('forgeGuidedB','Assign side B (paces)')}</div><p class="forge-stage-status" id="forgeStageStatus" role="status" aria-live="polite"></p>`;
      $('forgeGuidedA').dataset.expected=right[0];$('forgeGuidedB').dataset.expected=right[1];
    }else if(stage===1){
      area.innerHTML=`<p class="forge-stage-prompt">Step 2 · Square both sides.</p>
        <p class="forge-stage-help">A square means the number times itself. You can open the reference below if you need it.</p>
        <div class="forge-entry-pair">${blank('forgeGuidedASquare',`${q.a}² = ?`)}${blank('forgeGuidedBSquare',`${q.b}² = ?`)}</div><p class="forge-stage-status" id="forgeStageStatus" role="status" aria-live="polite"></p>`;
      $('forgeGuidedASquare').dataset.expected=right[2];$('forgeGuidedBSquare').dataset.expected=right[3];
    }else if(stage===2){
      area.innerHTML=`<p class="forge-stage-prompt">Step 3 · Add the two squares.</p>
        <p class="forge-stage-help">Your total will be c², the number inside the square root.</p>
        <div class="forge-stage-equation"><span>${right[2]} + ${right[3]} = </span>${blank('forgeGuidedSum','Total')}</div>
        <p class="forge-stage-status" id="forgeStageStatus" role="status" aria-live="polite"></p>`;
      $('forgeGuidedSum').dataset.expected=right[4];
    }else{
      area.innerHTML=`<p class="forge-stage-prompt">Step 4 · Find the square root.</p>
        <p class="forge-stage-help">What number multiplied by itself equals ${right[4]}? You can use the square chart below.</p>
        <div class="forge-stage-equation"><span>√${right[4]} = </span>${blank('forgeGuidedRoot','Missing distance in paces')}</div>
        <p class="forge-stage-status" id="forgeStageStatus" role="status" aria-live="polite"></p>`;
      $('forgeGuidedRoot').dataset.expected=right[5];
    }
    next.textContent=stage===3?'COMPLETE PROBLEM ✓':'NEXT →';next.disabled=true;
    const inputs=[...area.querySelectorAll('input[data-expected]')];
    inputs.forEach(input=>{input.addEventListener('input',update);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!next.disabled)next.click();else {const i=inputs.indexOf(input);if(i<inputs.length-1)inputs[i+1].focus();}}});});
    update(); inputs[0]?.focus({preventScroll:true});
  };
  next.onclick=()=>{
    if(next.disabled||hubView!=='forgeQuestion'||!forgeRun||forgeRun.locked||forgeRun.key!=='cavalry')return;
    if(stage===3){ next.disabled=true; area.querySelectorAll('input').forEach(el=>el.disabled=true);answerForge(q.ans,q,GREEK_FORGE.find(s=>s.key==='cavalry'));return; }
    stage++;draw();
  };
  draw();
}
function forgeWorkbenchHTML(key,q){
  let formula='',labels=[],cta='',note='';
  if(key==='archer'){
    formula='Angle A + Angle B + ? = 180°';labels=['Known angle A (°)','Known angle B (°)'];cta='Add known angles';
    note='The angles of a triangle always add to 180°. Find what is left.';
  }else{
    formula=q.shape==='rect'?'Area = length × width':'Area = base × height ÷ 2';
    labels=q.shape==='rect'?['Length (paces)','Width (paces)']:['Base (paces)','Height (paces)'];
    cta='Multiply measurements';note='Keep the measurements in the correct order and use the formula.';
  }
  const roots='';
  return `<section class="forge-workbench" aria-label="Math workbench"><div class="forge-work-head"><strong>Math Workbench</strong><small>Optional support · Use it to show your steps</small></div>
    <div class="forge-formula" aria-label="Formula">${formula}</div>
    <div class="forge-fields"><label>${labels[0]}<input id="forgeValA" type="number" inputmode="numeric" min="0" max="1000" step="1" placeholder="${q.a}" aria-label="${labels[0]}"></label>
    <label>${labels[1]}<input id="forgeValB" type="number" inputmode="numeric" min="0" max="1000" step="1" placeholder="${q.b}" aria-label="${labels[1]}"></label>
    <button id="forgeDoWork" class="forge-do" type="button">${cta}</button></div>
    <div class="forge-steps" id="forgeSteps" role="status" aria-live="polite">${note} Enter the numbers from the diagram to begin.</div>
    ${roots}</section>`;
}
function bindForgeWorkbench(key,q){
  const fieldA=$('forgeValA'),fieldB=$('forgeValB'),result=$('forgeSteps');
  const integerValue=el=>{if(!el||el.value.trim()===''||!/^\d+$/.test(el.value.trim()))return null;const n=Number(el.value);return Number.isSafeInteger(n)&&n>=0&&n<=1000?n:null;};
  $('forgeDoWork').onclick=()=>{
    const a=integerValue(fieldA),b=integerValue(fieldB);
    if(a===null||b===null){result.textContent='Enter both measurements from the diagram as whole numbers, then try again.';return;}
    if(key==='archer'){
      const total=a+b;
      result.innerHTML=`<span class="math-line">${a}° + ${b}° = ${total}°</span><span class="math-line">180° − ${total}° = ?</span>${total>=180?'Check your numbers: two known angles of a triangle must add to less than 180°.':'Now subtract from 180° to find the missing angle.'}`;
    }else{
      const total=a*b;
      result.innerHTML=`<span class="math-line">${a} × ${b} = ${total}</span><span class="math-line">${q.shape==='tri'?total+' ÷ 2 = ?':total+' square paces'}</span>${q.shape==='tri'?'Now divide by two for the triangular area.':'The area is length times width.'}`;
    }
  };
}

function renderForgeQuestion(){
  if(!forgeRun)return showHub('forge');
  const s=GREEK_FORGE.find(s=>s.key===forgeRun.key),q=FORGE_QUESTIONS[forgeRun.key][forgeRun.step];
  forgeRun.locked=false;
  const options=forgeAnswers(q);
  $('hub').innerHTML=renderHubHeader()+`<div class="hub-container" style="max-width:850px"><button id="backForgeQuestion" class="plain-btn hub-back">← FORGE</button><p class="hub-eyebrow">Ancient Greece · ${s.tag}</p><h1 class="hub-display" style="font-size:clamp(38px,5vw,66px)">${s.title}</h1><p class="hub-lead" style="margin-bottom:17px">${forgeRun.key==='cavalry'?'Complete each step of the triangle problem to earn your Greek unit unlock.':'Answer three mathematics questions to earn a Greek unit unlock.'}</p><div class="hub-panel"><span class="hub-level">QUESTION ${forgeRun.step+1} / 3 · UNLOCK ${s.unit.toUpperCase()}</span><h2 class="forge-question" style="margin-top:12px">${q.description}</h2><div class="forge-diagram">${forgeDiagram(forgeRun.key,q)}</div>${forgeRun.key==='cavalry'?forgeGuidedHTML(q):forgeWorkbenchHTML(forgeRun.key,q)}${forgeRun.key==='cavalry'?'':`<div class="forge-options">${options.map(v=>`<button class="forge-answer" data-answer="${v}">${v}${forgeRun.key==='archer'?'°':forgeRun.key==='catapult'?' paces²':' paces'}</button>`).join('')}</div>`}<div style="margin-top:15px"><button class="muted-btn" id="forgeHint" style="width:100%">SHOW A HINT</button><p class="mine-help" id="forgeHintText" style="display:none">${q.hint}</p></div><div class="mine-feedback" id="forgeFeedback"></div></div></div>`;
  if(forgeRun.key==='cavalry')bindForgeGuided(forgeRun.key,q);else bindForgeWorkbench(forgeRun.key,q);
  $('backForgeQuestion').onclick=()=>showHub('forge');$('forgeHint').onclick=()=>{const h=$('forgeHintText');h.style.display=h.style.display==='none'?'block':'none';$('forgeHint').textContent=h.style.display==='none'?'SHOW A HINT':'HIDE HINT';};
  $('hub').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerForge(Number(b.dataset.answer),q,s));
}
function answerForge(v,q,s){
  if(!forgeRun||forgeRun.locked)return;
  if(v!==q.ans){const f=$('forgeFeedback');f.style.color='#9c4c3b';f.textContent='Not quite. Use the hint and try another answer.';return;}
  forgeRun.locked=true;
  const f=$('forgeFeedback');f.style.color='#3e7251';f.textContent='Correct! Your knowledge strengthens the Greek army.';
  if(!activeUser.forge[forgeRun.key]){activeUser.forgeStep[forgeRun.key]=Math.max(activeUser.forgeStep[forgeRun.key],forgeRun.step+1);}
  savePlayer(false);
  setTimeout(()=>{
    if(hubView!=='forgeQuestion'||!forgeRun||forgeRun.key!==s.key)return;
    if(forgeRun.step===2){activeUser.forge[s.key]=true;activeUser.forgeStep[s.key]=3;savePlayer(false);
      forgeRun=null;
      $('hub').innerHTML=renderHubHeader()+`<div class="hub-container" style="max-width:730px;text-align:center"><p class="hub-eyebrow">GREEK FORGE · MASTERED</p><h1 class="hub-display">${s.unit.toUpperCase()} UNLOCKED</h1><p class="hub-lead" style="margin-left:auto;margin-right:auto">Your mathematical knowledge has unlocked ${s.unit.toLowerCase()}s in Conquest. Recruit them using the coins earned in the Mines.</p><div class="hub-panel"><img src="${thumb(s.key,'blue')}" alt="${s.unit}" style="height:125px;width:145px;object-fit:contain;image-rendering:pixelated"><h2>Ready for your army</h2><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="forgeRewardBack" class="muted-btn">BACK TO FORGE</button><button id="forgeRewardWar" class="gold-btn">GO TO CONQUEST</button></div></div></div>`;
      installHubHeader();$('forgeRewardBack').onclick=()=>showHub('forge');$('forgeRewardWar').onclick=enterConquest;
    }else{forgeRun.step++;renderForgeQuestion();}
  },650);
}
$('homeBtn').onclick=()=>{if(!G.battle&&G.phase!=='enemy'){closePanel();showHub('home');}};

/* ---------- start ---------- */
$('cloudMapStatus').onclick=()=>{if(['error','conflict'].includes(cloud.status))retryCloudSave();};
addEventListener('resize',()=>{resize();});
setup();ui();resize();requestAnimationFrame(loop);
function showIntro(){
panel(`<div class="kicker">Campaign / Hellenic Isles</div><h2>Siegecraft: Greece</h2>
<p>Blue versus Red for 8 territories, over ${MAX_ROUNDS} rounds.</p>
<ol><li><b>Muster.</b> Spend coins earned in the Mines on hoplites, archers, cavalry and catapults. Tap a card, then a blue territory.</li>
<li><b>Move or attack.</b> Select an army and hover a neighboring city to see an animated arching arrow. Click a friendly or neutral city to march; click a red city to review the attack and choose whether to fight.</li>
<li><b>Battle.</b> Battles play out live. Drag from a friendly squad to move or attack, or select its bottom card and click the battlefield. Catapult range and direction depend on your geometry calculations; incorrect answers change where the rocks land. Tap <b>Units</b> for detailed stats.</li>
<li><b>Win.</b> Hold the most territories when the rounds run out.</li></ol>
<button id="go" style="width:100%;margin-top:8px">Muster your army</button>
<button id="qb" class="btn2" style="width:100%;margin-top:8px">Quick battle</button>`);
$('go').onclick=()=>{closePanel();G.phase='muster';msg('Tap a unit card, then one of your blue territories.');ui();resize();};
$('qb').onclick=()=>showQuick(showIntro);
}
startSiegecraftCloud();
</script>
</body></html>
