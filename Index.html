<style>
:root{--ink:#3b3a36;--cream:#fbf5ec;--blue:#3e6a9e;--red:#a8452f;--bronze:#c9a24e}
html,body{margin:0;height:100%;background:#a5b6ba;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#top{position:fixed;top:0;left:0;right:0;padding:10px 10px 0;display:flex;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{background:rgba(251,245,236,.93);border-radius:12px;padding:7px 11px;box-shadow:0 1px 2px rgba(0,0,0,.08);pointer-events:auto}
#title{font-family:'Cormorant SC',serif;font-size:19px;font-weight:700;letter-spacing:.06em}
#status{font-size:13px;flex:1;min-width:120px}
#coins{font-weight:600;font-size:14px;white-space:nowrap}
#coins i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bronze);margin-right:5px;vertical-align:-1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ink);color:var(--cream);font-weight:600;cursor:pointer;pointer-events:auto}
button:disabled{opacity:.35;cursor:default}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:6px 8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#msg{background:rgba(59,58,54,.86);color:var(--cream);font-size:13px;padding:7px 12px;border-radius:10px;max-width:92%;text-align:center;min-height:16px}
#msg:empty{display:none}
#shop{display:flex;gap:6px;pointer-events:auto;max-width:100%}
.card{background:rgba(251,245,236,.95);border-radius:12px;padding:5px 8px 5px 5px;display:flex;align-items:center;gap:5px;border:2px solid transparent;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card img{height:42px;width:42px;object-fit:contain;image-rendering:pixelated}
.card.sel{border-color:var(--bronze);background:#fff8e6}
.card.off{opacity:.4}
.card b{display:block;font-size:12px}
.card span{font-size:11px;color:#6b665d;white-space:nowrap;display:block}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,50,55,.35);padding:14px;z-index:5}
.panel{background:var(--cream);border-radius:16px;padding:18px;max-width:430px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.panel h2{font-family:'Cormorant SC',serif;font-weight:700;margin:0 0 6px;font-size:25px;letter-spacing:.03em}
.panel p{font-size:14px;line-height:1.5;margin:6px 0}
.panel ol{font-size:14px;line-height:1.5;padding-left:20px;margin:8px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choices button{background:#efe6d6;color:var(--ink);font-size:18px;padding:12px}
.choices button.right{background:#6f9a62;color:#fff}.choices button.wrong{background:#c0614a;color:#fff}
#squads{display:none;gap:6px;pointer-events:auto;max-width:100%;overflow-x:auto;padding:2px}
.chip{background:rgba(251,245,236,.95);border-radius:12px;padding:5px 8px 5px 5px;display:flex;align-items:center;gap:6px;border:2px solid transparent;cursor:pointer;flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip img{height:38px;width:38px;object-fit:contain;image-rendering:pixelated}.chip b{font-size:12px;display:block}.chip .cn{font-size:11px;color:#6b665d;display:block}
.hb{width:64px;height:5px;background:#e3dccd;border-radius:3px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;width:100%}
.chip.sel{border-color:#3e6a9e;background:#fff8e6}.chip.dead{opacity:.35}.chip .fire{padding:7px 10px;background:#c9a24e;color:#3b2a10}
#actions{display:none;gap:6px;align-items:center;pointer-events:auto;background:rgba(251,245,236,.95);border-radius:12px;padding:5px 6px 5px 10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#actions .ah{font-size:12px;color:#5d5a52;margin-right:4px}#actions button{padding:8px 12px}#actions .fire{background:#c9a24e;color:#3b2a10}
#rot{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:8px;z-index:2}
#rot button{width:42px;height:42px;padding:0;border-radius:50%;background:rgba(251,245,236,.93);color:#3b3a36;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip.rec{border-color:#6f9a62}
@media (max-height:520px){body.onmap .card .pow{display:none}body.onmap .card img{height:30px;width:30px}body.onmap .card{padding:3px 8px 3px 3px}body.onmap #bottom{padding-bottom:4px}body.onmap #msg{position:fixed;top:54px;left:50%;transform:translateX(-50%);max-width:60%;font-size:12px}}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f6c;font-weight:600}
svg.dia{display:block;margin:8px auto 0;max-width:100%}
@media (max-width:520px){#shop{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.card{flex-direction:column;padding:4px;gap:0;text-align:center}.card img{height:34px;width:44px}.card b{font-size:11px}.card span{display:block;font-size:10px}.card .pow{font-size:10px}#title{display:none}#actions .ah{display:none}.chip img{height:30px;width:30px}.hb{width:44px}.chip{padding:4px 6px 4px 4px}#status{font-size:12px;min-width:0}#top{gap:6px}#top button{padding:8px 10px}}
/* --- proof-of-concept additions: tap targets, quiet battle UI, quick battle panel --- */
button{min-height:44px}
.chip{min-height:44px}
#rot button{width:44px;height:44px;background:rgba(251,245,236,.62)}
#muteBtn.off{opacity:.45;text-decoration:line-through}
body.inbattle #title,body.inbattle #status,body.inbattle #coins,body.inbattle #guideBtn{display:none}
body.inbattle #top{justify-content:flex-end}

@media (max-width:520px),(max-height:520px){.chip{flex-direction:column;gap:2px;padding:4px 5px}.chip .ci b,.chip .cn{display:none}.chip .hb{margin-top:0}.chip:has(.fire){flex-direction:row;gap:6px}#squads{justify-content:center}}
.qlab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a7f6c;font-weight:600;margin:12px 0 5px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.qgrid.q3{grid-template-columns:repeat(3,1fr)}
.qgrid button{background:#efe6d6;color:var(--ink);padding:6px 2px;font-size:13px;font-weight:500}
.qgrid button.on{background:var(--ink);color:var(--cream)}
.qtab{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.qtab th{font-size:12px;text-align:center;padding-bottom:4px}.qtab td{padding:3px 0}
.stp{display:flex;align-items:center;justify-content:center;gap:2px}.stp b{width:24px;text-align:center;font-size:15px}
.stp button{width:44px;padding:0;background:#efe6d6;color:var(--ink);font-size:20px;line-height:1}
.btn2{background:#efe6d6;color:#3b3a36}


#actions{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);row-gap:5px;}
#actions button{white-space:nowrap}
/* SIEGECRAFT / HELLAS — retro art direction v1
   Palette shared by the territory island, tactical city, buildings and HUD:
   Aegean teal · cypress · sage · limestone · clay roof · antique bronze.
   All UI frames use 2px lines, 2px stepped corners and hard-offset shadows. */
:root{
 --ink:#344346;--ink-strong:#27383e;--cream:#efe6d2;--paper:#f7efdc;
 --blue:#466f9b;--red:#a44f3d;--bronze:#b38b49;
 --stone:#e4d4b6;--line:#67726a;--soft:#d4c9ad;--moss:#768e5d;
 --frame:#506568;--shadow:#344b50;
}
html,body{background:#326f80;color:var(--ink);font-family:Inter,system-ui,sans-serif}
button,.card,.chip,.pill,.panel,#actions,#msg,.qgrid button,.choices button{
 border-radius:2px !important;
}
button,.card,.chip,.pill,.panel,#actions,#msg{box-shadow:3px 3px 0 rgba(38,58,60,.32) !important}
button{
 font-family:'Silkscreen','Courier New',monospace;
 font-weight:700;font-size:12px;letter-spacing:.015em;
 color:var(--paper);background:var(--ink-strong);
 border:2px solid #22373a;
 border-top-color:#819390;border-left-color:#819390;
 padding:8px 13px;min-height:44px;
 transition:background-color .12s linear;
}
button:hover:not(:disabled){background:#466369}
button:active:not(:disabled){box-shadow:1px 1px 0 rgba(38,58,60,.25) !important;transform:translate(2px,2px)}
button:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid #e2b65a;outline-offset:3px}
.pill{border:2px solid #798580;background:rgba(242,232,211,.96);padding:7px 12px;color:#314347}
#title{font-family:'Silkscreen','Courier New',monospace;font-size:15px;letter-spacing:.02em;line-height:1.2;
 background:#2e4d53;border-color:#213e43;color:#f3e5c8;text-shadow:1px 1px 0 #172f32}
#status{font-size:12px;font-weight:600;letter-spacing:.015em}
#coins{font-family:'Silkscreen','Courier New',monospace;font-size:13px;display:flex;align-items:center;gap:2px}
#coins i{width:13px;height:13px;background:#c6a45c;border:2px solid #756136;border-radius:1px;box-shadow:inset 2px 2px 0 #f5d688;transform:rotate(45deg);margin-right:7px}
#guideBtn{background:var(--paper);color:var(--ink);border-color:#807c66;border-top-color:#f9f5e8;border-left-color:#f9f5e8}

#endBtn{background:#a44f3d;border-color:#793a33;border-top-color:#d78868;border-left-color:#d78868}
#endBtn:hover{background:#b55e46}
#bottom{gap:8px;padding:6px 10px 12px}
#msg{color:#f7eddb;background:rgba(40,63,68,.91);border:2px solid #7e8e89;padding:7px 12px;font-size:12px;
 line-height:1.4;max-width:min(95%,650px);min-height:0}
.card,.chip{background:rgba(244,234,213,.97);border:2px solid #898676;box-shadow:3px 3px 0 rgba(36,57,57,.35) !important;
 padding:6px 9px 6px 5px;transition:background-color .12s linear,border-color .12s linear}
.card:hover:not(.off),.chip:hover:not(.dead){background:#fff1d3;border-color:#4e6a71}

.card.off,.chip.dead{opacity:.5;filter:saturate(.55)}
.card img,.chip img{image-rendering:pixelated;filter:drop-shadow(1px 2px 0 rgba(53,66,60,.22))}
.card b,.chip b{font-family:'Silkscreen','Courier New',monospace;font-size:11px;color:var(--ink-strong);line-height:1.45}
.card span,.chip .cn{font-size:11px;color:#6b715f;line-height:1.4}
.hb{height:6px;border:1px solid #888b75;background:#cbbfa1;border-radius:0}
.hb i{background:#668660}
#actions{border:2px solid #7f8475;background:rgba(244,234,213,.96);padding:5px 6px 5px 10px}
#actions .ah{color:#55645d;font-size:11px;line-height:1.3}

#rot{right:12px;gap:9px}
#rot button{border:2px solid #777f73 !important;border-radius:2px !important;background:rgba(243,231,207,.93) !important;
 color:#344b4b;font-family:Inter,system-ui,sans-serif;font-size:19px;box-shadow:3px 3px 0 rgba(38,58,60,.28) !important}
#overlay{background:rgba(27,45,49,.59)}
.panel{border:3px solid #6c7166;background:var(--cream);box-shadow:0 0 0 3px #d2c4a4,8px 8px 0 rgba(24,42,43,.48) !important;
 padding:20px;max-width:450px}

.kicker,.qlab{font-family:'Silkscreen','Courier New',monospace;font-size:10px;letter-spacing:.03em;color:#806d4b}

.stp b,.qtab{font-family:'Silkscreen','Courier New',monospace;font-size:12px}
.qtab th{color:#68715f}

body.inbattle #msg{background:rgba(43,64,65,.9);font-size:12px}

.hub-welcome{position:relative;min-height:min(82vh,740px);display:flex;align-items:center;overflow:hidden;background:#315e62;border-bottom:6px solid #a1a07b}
.hub-backdrop{position:absolute;inset:0;opacity:.58;background-position:center center;background-size:cover;image-rendering:pixelated;filter:saturate(.8) brightness(.62)}
.hub-welcome:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,47,49,.95) 0%,rgba(22,47,49,.86) 40%,rgba(25,47,49,.18) 100%);pointer-events:none}
.hub-welcome-inner{position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;padding:65px 25px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:32px}
.hub-signin{background:#efe5cc;color:#34474b;padding:25px;border:4px solid #b9a982;box-shadow:8px 9px 0 #17383a;max-width:400px;width:100%;justify-self:end}
.hub-signin h2{font:700 32px 'Cormorant SC',Georgia,serif;margin:0 0 8px}
.hub-signin label,.hub-label{display:block;font:700 11px 'Silkscreen',monospace;letter-spacing:.04em;margin:13px 0 8px;color:#5b6557}
#hub input,#hub select{width:100%;border:2px solid #a89d81;border-radius:2px;padding:12px 13px;font:600 16px Inter,system-ui,sans-serif;color:#354b4d;background:#fcf5e6;outline:none;min-height:44px}
.hub-input-row{display:flex;align-items:stretch;gap:8px}
.hub-input-row input{min-width:0;flex:1}
.hub-error{color:#a54838;font-weight:650;font-size:13px;min-height:18px;margin-top:10px}
.hub-signin .gold-btn{width:100%;margin-top:10px}
.hub-past-users{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
#hub .hub-user-chip{min-height:35px;font-size:10px;padding:6px 9px;background:#d7caaa;color:#3c5251}
.hub-note{font-size:12px;line-height:1.5;color:#65706a}
.hub-back{font:700 11px 'Silkscreen',monospace !important;margin-bottom:24px}
.hub-split{display:grid;grid-template-columns:1fr 310px;gap:18px}
.mine-main{background:#ede2c6;border:4px solid #b2a27e;padding:23px;color:#33494a;box-shadow:7px 7px 0 #182e30;position:relative;overflow:hidden}
.mine-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mine-question{font:900 clamp(48px,6vw,84px) Inter,'Trebuchet MS',system-ui,sans-serif;text-align:center;margin:24px 0;color:#31484a;letter-spacing:.04em;line-height:1.04;text-shadow:2px 2px 0 #d7cfb4;font-variant-numeric:tabular-nums}
.mine-answer-row{display:grid;grid-template-columns:1fr auto;gap:9px;max-width:400px;margin:0 auto}
#mineAnswer{font-size:24px!important;text-align:center;letter-spacing:.1em;font-weight:700!important}
.mine-progress{height:14px;background:#a9aa8b;border:3px solid #596b5b;margin:15px 0 6px}
.mine-progress span{display:block;height:100%;width:100%;background:#d4ad59;transition:width .1s linear}
.mine-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.mine-stat{background:#d9d3b9;border:2px solid #a59d80;padding:12px;text-align:center}
.mine-stat b{display:block;font:900 22px Inter,'Trebuchet MS',system-ui,sans-serif;color:#334a4c;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.mine-stat span{font-size:11px;color:#67715f}
.mine-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:400px;margin:15px auto}
#hub .mine-keypad button{font:900 22px Inter,'Trebuchet MS',system-ui,sans-serif;min-height:48px;padding:4px;background:#e2d5b7;color:#344b4d;letter-spacing:.02em}
.mine-help{background:#e7dbbd;border:2px solid #b3a27e;margin-top:13px;padding:13px}
.mine-times-table{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}
.mine-times-table span{background:#f6edd7;border:1px solid #b1a386;padding:7px;text-align:center;font:700 13px 'Courier New',monospace}
.mine-feedback{min-height:30px;font-size:16px;text-align:center;font-weight:750;color:#476849;margin-top:12px}
.mine-meter-text{font-size:12px;color:#667364;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mine-speed-live{color:#916b24;font-weight:850}
.mine-bonus-clock{font:850 15px Inter,'Trebuchet MS',system-ui,sans-serif;letter-spacing:.015em;color:#344b4d;font-variant-numeric:tabular-nums}
.mine-speed-ended{color:#707568;font-weight:650}
.hub-sidebar{border:3px solid #688179;background:#2b494b;padding:21px;color:#e2e9dc;align-self:start}
.hub-sidebar h3{font:700 24px 'Cormorant SC',serif;color:#f1deb9;margin:0 0 8px}
.hub-sidebar p{font-size:13px;line-height:1.65;color:#cddad1}
.hub-statline{border-bottom:1px solid #59746a;padding:11px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:10px}
.hub-statline strong{color:#f4d58b;font-family:'Silkscreen',monospace}
.forge-path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:21px 0}
.forge-card{background:#e9ddc1;border:3px solid #b9a580;box-shadow:5px 5px 0 #193437;color:#344a49;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:270px}
.forge-card.done{border-color:#8aa079}
.forge-card h3{font:700 27px 'Cormorant SC',Georgia,serif;margin:0}
.forge-card p{font-size:13px;line-height:1.55;flex:1;margin:0}
.forge-icon{font:700 45px Georgia,serif;color:#b58c48;line-height:1}
.forge-tag{color:#87744e;font:700 10px 'Silkscreen',monospace;text-transform:uppercase}
.forge-card button{width:100%}
.future-civ{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.future-civ div{border:2px solid #627970;background:#2b4447;padding:18px;font:700 14px 'Cormorant SC',serif;color:#d6ddce}
.future-civ small{display:block;margin-top:6px;font:700 9px 'Silkscreen',monospace;color:#a9b8ac}
.forge-question{font:700 25px 'Cormorant SC',serif;color:#374d4b;line-height:1.3}
.forge-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}
#hub .forge-options button{font-size:18px;background:#d8caab;color:#34494b;padding:18px 7px}
.forge-diagram{display:flex;align-items:center;justify-content:center;background:#e7dbc0;border:2px solid #b3a17b;min-height:160px;margin:12px 0;padding:12px}
.forge-diagram svg{width:min(100%,330px);height:145px}
.hub-level{font-size:11px;color:#8a744a;font-weight:750;letter-spacing:.02em}
@media(max-width:850px){.hub-grid,.forge-path{grid-template-columns:1fr}.hub-game-tile{min-height:195px}.hub-welcome-inner{grid-template-columns:1fr}.hub-signin{justify-self:start;max-width:510px}.hub-welcome:after{background:rgba(22,47,49,.78)}.hub-split{grid-template-columns:1fr}.future-civ{grid-template-columns:repeat(2,1fr)}.hub-container{padding:25px 16px 45px}}

.mine-readout,#mineCoins,.mine-meter-text,#mineAnswer{font-variant-numeric:tabular-nums}
#mineCoins{font:900 28px Inter,'Trebuchet MS',system-ui,sans-serif;letter-spacing:.05em;color:#edc96a;text-shadow:2px 2px 0 rgba(129,103,38,.18)}
.mine-answer-row input{font:900 32px Inter,'Trebuchet MS',system-ui,sans-serif;letter-spacing:.04em;color:#374f50;text-align:center}
.mine-hero-strip{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px;opacity:.95;flex-wrap:wrap}
.mine-hero-label{font:700 11px 'Silkscreen',monospace;color:#85714b;letter-spacing:.03em}
.mine-sprite{position:relative;display:inline-block;image-rendering:pixelated;transform:translateZ(0)}
.mine-sprite.coin{width:22px;height:22px;background:#d3a74d;box-shadow:inset 0 0 0 3px #f6dd86,inset 0 0 0 6px #d3a74d,2px 2px 0 #8d6b2b}
.mine-sprite.coin:before,.mine-sprite.coin:after{content:'';position:absolute;background:#f7e9a7}
.mine-sprite.coin:before{left:9px;top:4px;width:4px;height:14px}.mine-sprite.coin:after{left:4px;top:9px;width:14px;height:4px;opacity:.55}
.mine-sprite.ore{width:26px;height:20px;background:#6e847f;clip-path:polygon(8% 62%,20% 18%,65% 4%,92% 36%,86% 78%,40% 96%);box-shadow:inset 0 0 0 3px #94aaa5,2px 2px 0 #425452}
.mine-sprite.ore:before{content:'';position:absolute;left:7px;top:5px;width:5px;height:5px;background:#f0c55c;box-shadow:7px 4px 0 #f0c55c,3px 9px 0 #f0c55c}
.mine-sprite.pick{width:28px;height:24px}.mine-sprite.pick:before{content:'';position:absolute;left:12px;top:2px;width:4px;height:19px;background:#8e6840;box-shadow:0 0 0 2px rgba(0,0,0,.02)}
.mine-sprite.pick:after{content:'';position:absolute;left:3px;top:1px;width:22px;height:9px;background:#6c8580;clip-path:polygon(0 85%,24% 22%,48% 0,73% 12%,100% 80%,70% 52%,47% 46%,27% 58%);box-shadow:2px 2px 0 #425452}
.coin-fly,.coin-burst,.coin-gain{position:absolute;pointer-events:none;z-index:8}
.coin-fly{width:18px;height:18px;background:#d3a74d;box-shadow:inset 0 0 0 3px #f6dd86,inset 0 0 0 6px #d3a74d,2px 2px 0 rgba(110,82,24,.7);opacity:1;transition:transform .78s cubic-bezier(.22,.78,.18,1), opacity .78s ease-out}
.coin-fly:before,.coin-fly:after{content:'';position:absolute;background:#f7e9a7}.coin-fly:before{left:7px;top:3px;width:4px;height:12px}.coin-fly:after{left:3px;top:7px;width:12px;height:4px;opacity:.5}
.coin-burst{width:7px;height:7px;background:#f4d57c;box-shadow:0 0 0 2px #e0b44b;animation:coinBurst .55s ease-out forwards}
@keyframes coinBurst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.coin-gain{font:900 18px Inter,'Trebuchet MS',system-ui,sans-serif;color:#3e6a47;text-shadow:1px 1px 0 #f4ecd5;animation:coinGain .9s ease-out forwards}
@keyframes coinGain{0%{transform:translate(-50%,0) scale(.9);opacity:0}10%{opacity:1}100%{transform:translate(-50%,-36px) scale(1.08);opacity:0}}
.coin-bump{animation:coinBump .42s ease-out}
@keyframes coinBump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

@media(max-width:500px){.hub-top{padding:10px 13px}.hub-brand{font-size:11px}.hub-display{font-size:51px}.hub-welcome-inner{padding:38px 17px}.hub-game-tile{min-height:170px}.hub-signin{padding:15px}.mine-main{padding:13px}.mine-stats{gap:5px}.mine-stat{padding:10px 4px}.mine-stat b{font-size:16px}.mine-times-table{grid-template-columns:repeat(2,1fr)}.forge-options{grid-template-columns:1fr 1fr}.hub-top-right{gap:5px}#hub button{font-size:10px;padding:9px}.hub-balance{font-size:10px}.hub-container{padding:18px 12px 55px}}
@media (prefers-reduced-motion:reduce){#hub button{transition:none}}


/* Greek Forge: opt-in, accessible scaffold with readable numbers */
.forge-workbench{background:#e0d7bc;border:2px solid #a79a7a;padding:14px;margin:16px 0 2px;box-shadow:3px 3px 0 rgba(42,57,53,.16)}
.forge-work-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;border-bottom:1px solid #a9a084;padding-bottom:10px;margin-bottom:12px}
.forge-work-head strong{font:800 19px Inter,system-ui,sans-serif;color:#334c4c}
.forge-work-head small{color:#657267;font-size:12px;line-height:1.4}
.forge-formula{font:800 23px Georgia,serif;text-align:center;color:#344e4e;background:#f7f0df;border:1px solid #bcab83;padding:9px 7px;margin-bottom:11px}
.forge-fields{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:10px}
.forge-fields label,.forge-root-search label{display:block;font-weight:750;font-size:12px;color:#53635a;line-height:1.35}
#hub .forge-fields input,#hub .forge-root-search input{display:block;margin-top:5px;min-height:43px;padding:8px 10px;font:750 20px Inter,system-ui,sans-serif;letter-spacing:.01em;max-width:100%;background:#fff8ea}
#hub .forge-workbench button{min-height:43px;font-size:12px;line-height:1.25;padding:8px 11px}
#hub .forge-do{background:#45665d;color:#fff3de;border-color:#334d47;border-top-color:#789188;border-left-color:#789188}
.forge-steps{background:#f6efde;border:1px dashed #aea07d;padding:12px;font-size:15px;line-height:1.6;color:#445b51;margin-top:11px;min-height:48px}
.forge-steps b{font-variant-numeric:tabular-nums;color:#2c5350}
.forge-steps .math-line{display:block;font:750 17px Inter,system-ui,sans-serif;color:#374c4a;line-height:1.6}
.forge-root-details{margin-top:11px;background:#ede4cf;border:1px solid #afa082}
.forge-root-details summary{cursor:pointer;list-style:revert;padding:12px 14px;font-weight:800;font-size:14px;color:#374e4d;min-height:43px}
.forge-root-details summary:hover{background:#f6edda}
.forge-root-body{padding:0 13px 13px}
.forge-root-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end}
.forge-root-result{min-height:34px;margin:9px 0;color:#3e5a51;font:750 15px Inter,system-ui,sans-serif}
.forge-squares{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.forge-squares button{font:750 14px Inter,system-ui,sans-serif !important;min-height:38px !important;background:#f6eedc;color:#394c47 !important;border:1px solid #b9ac90 !important;box-shadow:1px 2px 0 #b9ad91 !important;padding:6px 4px !important;font-variant-numeric:tabular-nums}
.forge-squares button:hover{background:#ead5a5 !important}
.forge-mini-note{font-size:12px;color:#637066;line-height:1.4;margin:9px 0 0}
@media(max-width:620px){.forge-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.forge-fields button{grid-column:span 2}.forge-squares{grid-template-columns:repeat(4,minmax(0,1fr))}.forge-formula{font-size:20px}.forge-root-search{grid-template-columns:1fr}.forge-workbench{padding:10px}}

/* Forge step-by-step math scaffold: every answer must come from the student. */
.forge-guided{background:#e0d7bc;border:2px solid #a79a7a;padding:16px;margin:17px 0 3px;box-shadow:3px 3px 0 rgba(42,57,53,.16)}
.forge-guide-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.forge-guide-head strong{font:850 20px Inter,system-ui,sans-serif;color:#304b4b}
.forge-guide-head small{font:700 11px 'Silkscreen','Courier New',monospace;color:#746d57}
.forge-step-track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:12px 0 17px}
.forge-step-tag{padding:7px 3px;background:#cfc7ae;border:1px solid #a59b80;text-align:center;font:700 10px Inter,system-ui,sans-serif;color:#6c7064}
.forge-step-tag.active{background:#efe6cb;color:#314c4b;box-shadow:inset 0 -3px #c59b55;border-color:#997a4c}
.forge-step-tag.done{background:#d3e0c6;border-color:#73916d;color:#395d45}
.forge-stage{padding:15px;background:#f5eddb;border:2px solid #bbac8a;min-height:190px}
.forge-stage-prompt{font:750 18px Inter,system-ui,sans-serif;line-height:1.45;color:#354c4b;margin:0 0 9px}
.forge-stage-help{color:#657064;font-size:13px;line-height:1.4;margin:0 0 13px}
.forge-stage-equation{font:750 clamp(20px,2.7vw,29px) Georgia,serif;color:#334d4b;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:17px 0 14px}
.forge-entry-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.forge-entry{display:flex;gap:7px;align-items:center;min-width:0}
.forge-entry label{display:block;flex:1;min-width:0;font-weight:800;font-size:13px;color:#53635a}
#hub .forge-entry input{display:block;box-sizing:border-box;width:100%;height:53px;margin-top:6px;padding:9px 12px;background:#fff8e8;border:2px solid #a89b7e;color:#304748;font:800 25px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;outline:none;border-radius:0}
#hub .forge-entry input:focus{border-color:#4d7665;box-shadow:0 0 0 3px rgba(90,130,95,.13)}
#hub .forge-entry input.is-wrong{border-color:#b66755;background:#fff0e8}
#hub .forge-entry input.is-correct{border-color:#72916b;background:#f1f8e9}
.forge-stage-equation .forge-entry{flex:0 1 116px}
.forge-stage-equation .forge-entry input{margin:0}
.forge-stage-equation .forge-entry label{font-size:12px}
.forge-stage-status{font-size:13px;line-height:1.4;min-height:23px;color:#717365;margin-top:11px}
.forge-stage-status.ready{font-weight:750;color:#3e754b}
.forge-guide-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:13px}
#hub .forge-next{background:#c39b52;color:#22393a;border:2px solid #876a3e;border-top-color:#edcf8b;border-left-color:#edcf8b;min-width:184px;font:800 12px 'Silkscreen',monospace;min-height:48px}
#hub .forge-next:disabled{opacity:.48;cursor:not-allowed;background:#c4bea7;color:#687067;border:2px solid #a99d82;box-shadow:none}
#hub .forge-next:not(:disabled){box-shadow:3px 3px 0 #7f775e}
.forge-reference{margin-top:13px;background:#eee4cf;border:1px solid #afa082}
.forge-reference summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:14px;color:#374e4d;min-height:42px}
.forge-reference .forge-root-body{padding:0 13px 13px}
.forge-reference .forge-squares{margin-top:10px}
.forge-reference .forge-squares .square-ref{background:#f6eedc;border:1px solid #b9ac90;box-shadow:1px 2px 0 #b9ad91;padding:7px 2px;text-align:center;font:750 14px Inter,system-ui,sans-serif;color:#394c47}
.forge-guide-done{color:#466947;background:#e1eacc;padding:11px;border:1px solid #92a881;margin-top:10px;font-weight:750}
@media(max-width:620px){.forge-guided{padding:10px}.forge-entry-pair{grid-template-columns:1fr}.forge-stage{padding:10px}.forge-step-tag{font-size:9px}.forge-step-track{gap:3px}.forge-guide-actions{justify-content:stretch}#hub .forge-next{width:100%}}


/* Hoplite gate assault: an educational siege challenge, not a timed quiz. */
.gate-progress{display:flex;gap:7px;margin:15px 0 18px}
.gate-progress span{flex:1;height:12px;background:#d2c3a1;border:2px solid #8c886e;box-shadow:2px 2px 0 #b4a68a}
.gate-progress span.done{background:#b68e43;border-color:#806331}
.gate-math{font:800 clamp(31px,5vw,49px) Inter,'Trebuchet MS',system-ui,sans-serif;text-align:center;color:#344a48;padding:17px;background:#e6d9b8;border:2px solid #b2a07a;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.gate-math-input{display:flex;gap:10px;margin:12px 0}
.gate-math-input input{min-width:0;flex:1;padding:11px;font:800 28px Inter,system-ui,sans-serif;text-align:center;color:#344a48;background:#f7edd8;border:2px solid #ab9b76;border-radius:0}
.gate-math-input button{flex:0 0 auto}
.gate-feedback{min-height:26px;font-size:14px;color:#486a4c;font-weight:700;margin:8px 0}
.gate-reference{margin-top:12px;padding:12px;background:#e4d7ba;border:2px solid #b8a781}
.gate-reference summary{cursor:pointer;font-weight:750;color:#526961}
.gate-reference-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:9px}
.gate-reference-grid span{padding:5px 3px;text-align:center;background:#f6edd8;font:700 12px Inter,system-ui,sans-serif;color:#354a4b}
.gate-panel .kicker{margin-bottom:6px}
.gate-panel p{margin:8px 0}
.gate-panel{max-width:860px}.gate-scene{position:relative;height:182px;margin:14px 0 16px;background:#6e9598;border:3px solid #a99775;box-shadow:inset 0 -6px 0 rgba(43,71,73,.14);overflow:hidden}.gate-scene-back{position:absolute;inset:0;background:linear-gradient(#6e9598 0 57%,#89a6a2 57% 58%,#6f8e89 58% 100%);opacity:.95}.gate-scene-floor{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(#819f95,#759085);border-top:3px solid #58736d}.gate-scene-floor:before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;opacity:.22}.gate-scene-wall{position:absolute;right:86px;bottom:48px;width:246px;height:108px;background:#dfd6c5;border:3px solid #93a09a;box-shadow:inset 0 -10px 0 #c6c2b7}.gate-scene-tower{position:absolute;bottom:40px;width:30px;height:84px;background:#dfd6c5;border:3px solid #93a09a;box-shadow:inset 0 -8px 0 #c6c2b7}.gate-scene-tower.left{right:304px}.gate-scene-tower.right{right:76px}.gate-scene-gate{position:absolute;right:170px;bottom:49px;width:76px;height:64px;background:#8c6844;border:3px solid #6e5132;display:flex;gap:3px;padding:0 5px;align-items:stretch;justify-content:center;transform-origin:center bottom;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}.gate-door-half{flex:1;background:repeating-linear-gradient(90deg,#9f7447 0 8px,#855f3a 8px 16px);border-left:2px solid rgba(60,40,20,.4);border-right:2px solid rgba(60,40,20,.3)}.gate-lock{position:absolute;left:50%;top:27px;transform:translateX(-50%);width:16px;height:12px;background:#d4b15b;border:2px solid #8b6a2a;z-index:2}.gate-cracks{position:absolute;inset:0;pointer-events:none;opacity:0}.gate-cracks i{position:absolute;display:block;width:3px;background:#553b26;transform-origin:top center;opacity:.82}.gate-scene[data-stage='1'] .gate-cracks,.gate-scene[data-stage='2'] .gate-cracks,.gate-scene[data-stage='3'] .gate-cracks,.gate-scene[data-stage='4'] .gate-cracks{opacity:1}.gate-scene[data-stage='1'] .gate-door-half{filter:saturate(.95)}.gate-scene[data-stage='2'] .gate-gate,.gate-scene[data-stage='2'] .gate-scene-gate{transform:translateY(0) skewX(-1deg)}.gate-scene[data-stage='3'] .gate-scene-gate{transform:rotate(-2deg) translateY(2px)}.gate-scene[data-stage='4'] .gate-scene-gate{transform:rotate(-4deg) translateY(5px)}.gate-scene[data-stage='5'] .gate-scene-gate{transform:none;background:transparent;border-color:transparent;gap:18px;padding:0 0}.gate-scene[data-stage='5'] .gate-door-half:first-child{transform:rotate(-82deg) translate(-24px,18px)}.gate-scene[data-stage='5'] .gate-door-half:last-child{transform:rotate(82deg) translate(24px,18px)}.gate-scene[data-stage='5'] .gate-lock,.gate-scene[data-stage='5'] .gate-cracks{opacity:0}.gate-arch{position:absolute;right:160px;bottom:49px;width:96px;height:68px;border:3px solid #93a09a;background:rgba(77,106,107,.28)}.gate-hoplite{position:absolute;bottom:28px;width:42px;height:auto;image-rendering:pixelated;filter:drop-shadow(3px 4px 0 rgba(25,43,44,.28));animation:gateBob .78s steps(2,end) infinite}.gate-hoplite.h1{left:92px;animation-delay:0s}.gate-hoplite.h2{left:138px;animation-delay:.18s}.gate-hoplite.h3{left:184px;animation-delay:.36s}.gate-hoplite.smash{animation:gateLunge .5s ease-out}.gate-trail{position:absolute;left:226px;bottom:74px;width:110px;height:4px;background:linear-gradient(90deg,rgba(180,142,67,.0),rgba(180,142,67,.7),rgba(180,142,67,0));opacity:0;transform:translateX(-12px)}.gate-scene.hit .gate-trail{opacity:1;animation:trailHit .5s ease-out}.gate-impact{position:absolute;right:234px;bottom:88px;width:24px;height:24px;opacity:0}.gate-impact:before,.gate-impact:after{content:'';position:absolute;left:50%;top:50%;background:#d6b25d;transform:translate(-50%,-50%)}.gate-impact:before{width:24px;height:4px}.gate-impact:after{width:4px;height:24px}.gate-scene.hit .gate-impact{opacity:1;animation:impactPop .46s ease-out}.gate-dust{position:absolute;right:214px;bottom:46px;width:74px;height:32px;opacity:0}.gate-dust span{position:absolute;bottom:0;background:rgba(228,221,199,.9);width:14px;height:10px;border-radius:50%}.gate-dust span:nth-child(1){left:8px}.gate-dust span:nth-child(2){left:28px;width:18px;height:12px}.gate-dust span:nth-child(3){left:50px;width:12px;height:9px}.gate-scene.hit .gate-dust{opacity:1;animation:dustPuff .55s ease-out}.gate-scene-label{position:absolute;left:18px;top:12px;font:700 11px 'Silkscreen',monospace;color:#f3ead4;background:rgba(34,60,63,.34);padding:6px 8px;border:2px solid rgba(229,220,196,.35)}.gate-scene-tip{position:absolute;left:18px;bottom:10px;font:700 12px Inter,system-ui,sans-serif;color:#274344;background:rgba(239,229,203,.74);padding:4px 8px;border:2px solid rgba(158,143,113,.55)}@keyframes gateBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes gateLunge{0%{transform:translateX(0) translateY(0)}35%{transform:translateX(18px) translateY(-2px)}100%{transform:translateX(0) translateY(0)}}@keyframes trailHit{0%{opacity:0;transform:translateX(-18px) scaleX(.7)}30%{opacity:1}100%{opacity:0;transform:translateX(4px) scaleX(1.1)}}@keyframes impactPop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1.5);opacity:0}}@keyframes dustPuff{0%{transform:translateY(4px) scale(.85);opacity:0}20%{opacity:1}100%{transform:translateY(-8px) scale(1.2);opacity:0}}

/* RISK-STYLE ARMY DEPLOYMENT: clear two-column troop split. */
#panel.army-deploy-dialog{max-width:min(760px,94vw);width:94vw;max-height:88vh;overflow-y:auto}
.army-deploy .army-route{display:flex;align-items:center;gap:9px;background:#e5d8bc;border:2px solid #b1a17f;padding:10px 12px;margin:12px 0 15px;flex-wrap:wrap;font-size:14px}
.army-deploy .army-route b{font-size:16px;color:#344d4e}.army-deploy .army-route .route-arrow{color:#a7503e;font-size:24px;font-weight:900}
.army-deploy .army-route small{display:block;font-size:11px;color:#66716b;font-weight:500}
.army-deploy-head{display:grid;grid-template-columns:minmax(145px,1.5fr) minmax(115px,1fr) minmax(115px,1fr);gap:7px;align-items:end;color:#52655b;font-weight:800;font-size:13px;margin-bottom:8px}
.army-deploy-head span:nth-child(n+2){text-align:center}
.army-unit-row{display:grid;grid-template-columns:minmax(145px,1.5fr) minmax(115px,1fr) minmax(115px,1fr);gap:7px;align-items:center;padding:8px 0;border-top:1px solid #d7c8a9}
.army-unit-type{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750}.army-unit-type img{width:38px;height:42px;object-fit:contain;image-rendering:pixelated}.army-unit-type small{display:block;font-size:11px;color:#64716a;font-weight:500}
.army-stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.army-stepper button{width:36px;height:38px;padding:0 !important;min-height:0 !important;flex-shrink:0;font:900 23px Inter,system-ui,sans-serif !important}
.army-stepper b{font:850 19px Inter,system-ui,sans-serif;min-width:24px;text-align:center;font-variant-numeric:tabular-nums;color:#34484b}
.army-stay{color:#4f6d57;font:800 20px Inter,system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.army-presets{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
#panel .army-presets button{font:700 12px Inter,system-ui,sans-serif;min-height:35px;padding:7px 12px}
.army-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.army-summary div{padding:11px 12px;background:#dfd7be;border:2px solid #ada181}
.army-summary span{display:block;font-size:12px;color:#606d64}.army-summary strong{display:block;font:850 24px Inter,system-ui,sans-serif;color:#33494b;font-variant-numeric:tabular-nums}
.army-warning{font-weight:650;font-size:13px;padding:9px 11px;background:#f1e5c7;border-left:4px solid #bc8844;color:#76623f;margin:8px 0}
.army-odds{background:#f5ebd6;border:1px solid #baaa89;padding:12px;margin:10px 0;color:#53655b;font-size:13px;line-height:1.6}
.army-odds strong{color:#374d4e}.army-odds small{display:block;color:#778074}
.army-deploy-actions{display:flex;gap:9px;margin-top:15px}.army-deploy-actions button{flex:1}
@media(max-width:540px){#panel.army-deploy-dialog{width:96vw;padding:11px}.army-deploy-head,.army-unit-row{grid-template-columns:minmax(95px,1.4fr) minmax(115px,1fr) minmax(55px,.6fr);gap:3px}.army-unit-type{font-size:12px;gap:2px}.army-unit-type img{width:29px;height:33px}.army-unit-type small{font-size:10px}.army-stepper{gap:2px}.army-stepper button{width:30px;height:34px}.army-stepper b{font-size:15px;min-width:17px}.army-stay{font-size:16px}.army-deploy-actions{flex-direction:column}}

const IW=1586,IH=992;
const _hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const _seaRGB=_hx(ART.sea),_seaLightRGB=_hx(ART.seaLight),_sageRGB=_hx(ART.sage),_sageDarkRGB=_hx(ART.sageDark),_stoneRGB=_hx(ART.stone),_stoneShadowRGB=_hx(ART.stoneShadow),_roofRGB=_hx(ART.roof),_paperRGB=_hx(ART.paper);
function _blendRGB(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function _lerp(a,b,t){return a+(b-a)*t;}
function buildMatchedMap(){
  if(!MAPIMG.complete||!MAPIMG.naturalWidth)return;
  const c=document.createElement('canvas');c.width=IW;c.height=IH;const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(MAPIMG,0,0,IW,IH);
  try{
    const id=x.getImageData(0,0,IW,IH),d=id.data;
    for(let i=0;i<d.length;i+=4){
      const a=d[i+3]; if(!a) continue;
      let r=d[i],g=d[i+1],b=d[i+2];
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b), lum=(0.299*r+0.587*g+0.114*b)/255;
      let target=[r,g,b], amt=.18;
      if(b>r*1.05 && b>g*0.92){ // sea / surf
        target=_blendRGB(_seaRGB,_seaLightRGB,Math.min(1,lum*1.15)); amt=.48;
      }else if(g>=r*.88 && g>b*.86){ // land / grass
        target=_blendRGB(_sageDarkRGB,_sageRGB,Math.min(1,lum*1.08)); amt=.38;
      }else if(r>g*1.06 && g>b*.95){ // roofs / warm flags
        target=_blendRGB(_roofRGB,_paperRGB,Math.max(0,Math.min(1,(lum-.18)*1.25))); amt=.34;
      }else{ // roads / cliffs / stone
        target=_blendRGB(_stoneShadowRGB,_stoneRGB,Math.min(1,lum*1.05)); amt=.42;
      }
      const gray=(r+g+b)/3;
      r=_lerp(gray,r,.78); g=_lerp(gray,g,.78); b=_lerp(gray,b,.78); // slight desaturation
      d[i]=Math.max(0,Math.min(255,Math.round(_lerp(r,target[0],amt))));
      d[i+1]=Math.max(0,Math.min(255,Math.round(_lerp(g,target[1],amt))));
      d[i+2]=Math.max(0,Math.min(255,Math.round(_lerp(b,target[2],amt))));
    }
    x.putImageData(id,0,0);
  }catch(e){}
  // unify the overall contrast/value to the battlefield art
  x.save(); x.globalCompositeOperation='multiply'; x.fillStyle='rgba(74,108,106,.10)'; x.fillRect(0,0,IW,IH); x.restore();
  x.save(); x.globalCompositeOperation='screen'; x.fillStyle='rgba(246,240,222,.07)'; x.fillRect(0,0,IW,IH); x.restore();
  MAPMATCH=c;
}

function drawBigWaveGroup(wx,wy,now,s,idx){
  const bx=L.ox+wx*s, by=L.oy+wy*s;
  const ph=idx*0.73;
  const drift=Math.sin(now*0.0017+ph)*4.5*s;
  const bob=Math.cos(now*0.0013+ph*1.3)*1.4*s;
  const alpha=.42+.10*Math.sin(now*0.0021+ph);
  ctx.save();
  ctx.globalAlpha=alpha;
  // soft turquoise underglow to help the baked wave art feel alive
  ctx.fillStyle='rgba(116,170,183,.12)';
  for(let i=0;i<3;i++){
    const ox=(i-1)*16*s+drift*.4, oy=(i%2)*2*s+bob;
    ctx.fillRect(Math.round(bx+ox),Math.round(by+oy),Math.max(10,Math.round(18*s)),1);
  }
  // bright crest lines matching the visible map ripples
  ctx.fillStyle='rgba(228,241,236,.55)';
  const segs=[[-16,-1,11],[0,0,14],[16,-2,10],[-8,4,8],[10,5,7]];
  for(const [ox,oy,w] of segs){
    const wob=Math.sin(now*0.003 + ph + ox*.07)*1.4*s;
    ctx.fillRect(Math.round(bx+(ox*s)+drift+wob),Math.round(by+oy*s+bob),Math.max(5,Math.round(w*s)),1);
  }
  // tiny shadow line for depth
  ctx.fillStyle='rgba(49,101,114,.18)';
  for(const [ox,oy,w] of segs.slice(0,3)){
    ctx.fillRect(Math.round(bx+(ox*s)+drift),Math.round(by+(oy+2)*s+bob),Math.max(5,Math.round((w-2)*s)),1);
  }
  ctx.restore();
}

// Chunky, screen-aligned pixels give the campaign orders the same edges as the unit sprites.
function mapPxStroke(point,a,b,color,weight,step){
  const n=Math.max(2,Math.ceil((b-a)*130));const half=Math.floor(weight/2);
  ctx.fillStyle=color;
  for(let i=0;i<=n;i++){
    const p=point(a+(b-a)*i/n),x=Math.round(p.x/step)*step,y=Math.round(p.y/step)*step;
    ctx.fillRect(x-half,y-half,weight,weight);
  }
}
function mapPxArrowTip(point,t,color,scale=1){
  const p=point(t),a=point(Math.max(0,t-.015)),b=point(Math.min(1,t+.015));
  let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
  const nx=-dy,ny=dx,tail=17*scale,wing=11*scale;
  const tip={x:p.x+dx*4*scale,y:p.y+dy*4*scale};
  const left={x:p.x-dx*tail+nx*wing,y:p.y-dy*tail+ny*wing};
  const right={x:p.x-dx*tail-nx*wing,y:p.y-dy*tail-ny*wing};
  ctx.save();ctx.lineJoin='miter';ctx.lineCap='square';
  ctx.beginPath();ctx.moveTo(Math.round(tip.x),Math.round(tip.y));ctx.lineTo(Math.round(left.x),Math.round(left.y));ctx.lineTo(Math.round(right.x),Math.round(right.y));ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.lineWidth=Math.max(3,3*scale);ctx.strokeStyle='#f9e7bb';ctx.stroke();
  ctx.restore();
}
function mapCityBrackets(t,color,now,strong){
  const p=tr({x:t.fort.x,y:t.fort.y-19});
  const rx=Math.max(22,62*L.s),ry=Math.max(22,47*L.s),arm=Math.max(8,15*L.s),k=Math.max(3,Math.round(4*L.s));
  const op=strong?.83+.17*Math.sin(now/190):.73+.17*Math.sin(now/270);
  ctx.save();ctx.globalAlpha=op;ctx.fillStyle='#233a3e';
  for(const sx of [-1,1])for(const sy of [-1,1]){
    const x=Math.round(p.x+sx*rx),y=Math.round(p.y+sy*ry),u=sx===-1?0:-arm,v=sy===-1?0:-arm;
    ctx.fillRect(x+u+2,y+2,arm+3,k+2);ctx.fillRect(x+2,y+v+2,k+2,arm+3);
  }
  ctx.fillStyle=color;
  for(const sx of [-1,1])for(const sy of [-1,1]){
    const x=Math.round(p.x+sx*rx),y=Math.round(p.y+sy*ry),u=sx===-1?0:-arm,v=sy===-1?0:-arm;
    ctx.fillRect(x+u,y,arm,k);ctx.fillRect(x,y+v,k,arm);
  }
  ctx.restore();
}
function drawMapRoute(from,to,now){
  const a=tr({x:from.fort.x+7,y:from.fort.y-18}),b=tr({x:to.fort.x+7,y:to.fort.y-18});
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  const lift=Math.max(64,Math.min(188,dist*.36));
  const control={x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-lift};
  const point=t=>{const u=1-t;return{x:u*u*a.x+2*u*t*control.x+t*t*b.x,y:u*u*a.y+2*u*t*control.y+t*t*b.y};};
  const attack=to.owner==='red',primary=attack?'#b24d39':'#5f827a',light=attack?'#f0bc70':'#dbe7c9';
  const pix=Math.max(2,Math.round(2.6*L.s));
  const thick=Math.max(7,Math.round(9*L.s)),thin=Math.max(3,Math.round(4*L.s));
  // Permanent clear arch, warm outlined bevel, then an animated outward-and-returning highlight.
  mapPxStroke(point,0,1,'rgba(23,51,54,.53)',thick+8,pix);
  mapPxStroke(point,0,1,'#f4e6c8',thick+4,pix);
  mapPxStroke(point,0,1,primary,thick,pix);
  const head=.13+.84*(.5-.5*Math.cos(now/540));
  mapPxStroke(point,Math.max(0,head-.24),head,light,thin+2,pix);
  // Two traveling lights reinforce direction without strobing or obscuring the world map.
  const dots=[Math.max(0,head-.13),Math.max(0,head-.20)];
  ctx.fillStyle='#fff4d3';for(const t of dots){const p=point(t),k=Math.max(4,Math.round(6*L.s));ctx.fillRect(Math.round(p.x-k/2),Math.round(p.y-k/2),k,k);}
  mapPxArrowTip(point,head,primary,Math.max(.8,Math.min(1.2,L.s*1.3)));
  // Fixed arrowhead clarifies which end is the defender even as the animated head returns.
  mapPxArrowTip(point,.985,primary,Math.max(.7,Math.min(.95,L.s*1.1)));
  mapCityBrackets(to,attack?'#de7b52':'#d7e5ca',now,true);
}

function drawPixelBanner(t){

   ctx.fillStyle='#594a37';ctx.fillRect(x-2,y-3,ww+4,Math.max(2,p));
   ctx.fillStyle=t.owner==='blue'?COL.blue:t.owner==='red'?COL.red:'#99988a';
   ctx.fillRect(x,y,ww,hh-p*2);ctx.fillRect(x+p,y+hh-p*2,ww-p*2,p);
   ctx.fillStyle='rgba(19,37,38,.28)';ctx.fillRect(x+ww-p,y,p,hh-p*2);
   ctx.fillStyle='#f3e6c9';

function drawMapSeaWaves(now,s){
  const x0=Math.round(L.ox),y0=Math.round(L.oy),ww=Math.round(IW*s),hh=Math.round(IH*s);
  ctx.save();
  ctx.beginPath(); ctx.rect(x0,y0,ww,hh);
  T.forEach(t=>{const pts=t.poly; ctx.moveTo(L.ox+pts[0].x*s,L.oy+pts[0].y*s); for(let i=1;i<pts.length;i++) ctx.lineTo(L.ox+pts[i].x*s,L.oy+pts[i].y*s); ctx.closePath();});
  ctx.clip('evenodd');
  const scale=Math.max(.8,s);

  // Animate the large visible wave clusters from the map art.
  BIG_WAVE_GROUPS.forEach((p,i)=>drawBigWaveGroup(p[0],p[1],now,s,i));

  // Secondary subtle motion so the whole sea feels alive.
  ctx.globalAlpha=.16;
  for(let band=0; band<7; band++){
    const yy=y0+hh*(.10+band*.12);
    const drift=(now*0.018*(band%2?1:-1)+band*29)%150;
    const amp=3.6*scale+band%2;
    const gap=74*scale;
    for(let xx=x0-120; xx<x0+ww+120; xx+=gap){
      const px=xx+drift;
      const py=yy+Math.sin((px*0.012)+(now*0.0015)+band)*amp;
      ctx.fillStyle=band%2?'rgba(219,236,238,.18)':'rgba(103,151,164,.14)';
      ctx.fillRect(Math.round(px),Math.round(py),Math.max(10,Math.round(18*scale)),1);
      ctx.fillRect(Math.round(px+26*scale),Math.round(py+1),Math.max(7,Math.round(12*scale)),1);
    }
  }

  // brighter shore shimmer, subtle and slow
  ctx.globalAlpha=.26;
  T.forEach((t,ti)=>{
    const pts=t.poly;
    for(let i=0;i<pts.length;i+=4){
      const a=pts[i],b=pts[(i+1)%pts.length];
      const mx=(a.x+b.x)*.5*s+L.ox,my=(a.y+b.y)*.5*s+L.oy;
      const dx=(b.x-a.x),dy=(b.y-a.y); const mag=Math.hypot(dx,dy)||1;
      const nx=(-dy/mag)*5*s, ny=(dx/mag)*5*s;
      const flick=.55+.45*Math.sin(now*0.003+ti+i);
      ctx.fillStyle='rgba(242,248,240,'+(0.08+0.07*flick)+')';
      for(let p=0;p<3;p++) ctx.fillRect(Math.round(mx+nx+p*3),Math.round(my+ny+p%2),6,1);
    }
  });
  ctx.restore();
}
function drawMap(now){

  if(MAPIMG.complete&&MAPIMG.naturalWidth){
    ctx.imageSmoothingEnabled=false;

    ctx.drawImage(mapArt,Math.round(L.ox),Math.round(L.oy),Math.round(IW*s),Math.round(IH*s));
    drawMapSeaWaves(now,s);
  }

  const halo=(t,col,alpha=1)=>{
    const p=tr(t.hit),r=Math.max(22,48*s);ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;
    const n=Math.max(50,Math.round(r*5)),k=Math.max(2,Math.round(2*s));

     ctx.save();ctx.font=`700 ${fs}px Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';

     ctx.fillStyle='#52615b';ctx.fillRect(x,y,ww,hh);
     ctx.fillStyle='#efe4ca';ctx.fillRect(x+2,y+2,ww-4,hh-4);
     ctx.fillStyle='#faf0d8';ctx.fillRect(x+4,y+3,ww-8,hh-8);
     ctx.fillStyle='#ae8c52';ctx.fillRect(x+5,y+hh-5,ww-10,2);
     ctx.fillStyle='#34474a';ctx.fillText(txt,Math.round(pos.x),Math.round(pos.y));ctx.restore();
     drawPixelBanner(t);
    const present=TYPES.filter(k=>t.units[k]>0);if(!present.length)return;

      const r=Math.max(9,12*s),bx=x+Math.max(9,9*s),by=y+3;
       drawCountBadge(bx,by,r,team,t.units[ty]);
    });
  });
}

function loop(now){
  mineTimerTick(now);
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];const t=Math.min(1,(now-tw.t0)/tw.ms);tw.fn(t);if(t>=1){tweens.splice(i,1);tw.res();}}
  cv.style.imageRendering='pixelated';
  // Do not redraw the full map behind menus; the hub has its own scenery.
  // Mining questions still use the same clock via mineTimerTick above.
  if(!document.body.classList.contains('inhub')){
    if(G.battle){rtUpdate(now);if(G.battle){drawRT(now);updateChips();}}else{lastT=0;if(PA)resize();drawMap(now);}
  }
  requestAnimationFrame(loop);
}

// The old world-space check only saw the feet, so clicking a torso accidentally moved the prior squad.
function friendlySquadAtScreen(sx,sy){
  if(!RB||!RB.L||!PA)return null;
  const mine=selectablePlayerSquads();
  for(const q of mine){
    if(q.flag&&sx>=q.flag.x-5&&sx<=q.flag.x+q.flag.w+5&&sy>=q.flag.y-5&&sy<=q.flag.y+q.flag.h+5)return q;
  }
  let best=null,bestScore=Infinity;
  for(const q of mine)for(const sd of q.soldiers){
    if(!sd.alive)continue;
    const p=P(sd.x,sd.z),m=PXU[sd.type]?.meta;
    const w=m?m.cw*PA:24*PA,h=m?m.ch*PA:29*PA;
    const ax=m?m.ax*PA:w/2,ay=m?m.ay*PA:h;
    const pad=Math.max(7,PA*3);
    const left=p.x-ax-pad,right=left+w+2*pad,top=p.y-ay-pad,bottom=top+h+2*pad;
    if(sx<left||sx>right||sy<top||sy>bottom)continue;
    const dx=(sx-(left+right)/2)/(w/2+pad),dy=(sy-(top+bottom)/2)/(h/2+pad);
    const score=dx*dx+dy*dy;
    if(score<bestScore){best=q;bestScore=score;}
  }
  return best;
}
// Charge targeting uses the same screen-space enemy artwork and red rings as the drawn overlays.
function chargedEnemyAtScreen(sx,sy){
  if(!RB||!RB.L)return null;
  let best=null,bestScore=Infinity;
  for(const e of RB.soldiers){
    if(!e.alive||!e.sq.active||e.team!=='red')continue;
    const p=P(e.x,e.z),m=PXU[e.type]?.meta;
    const r=Math.max(19,2.1*RB.L.s);
    const px=sx-p.x,py=sy-p.y;
    const ring=(px*px)/(r*r)+(py*py)/((r*.8)*(r*.8));
    const w=m?m.cw*PA:30*PA,h=m?m.ch*PA:32*PA;
    const ax=m?m.ax*PA:w/2,ay=m?m.ay*PA:h;
    const body=sx>p.x-ax-5&&sx<p.x-ax+w+5&&sy>p.y-ay-5&&sy<p.y-ay+h+5;
    if(ring>1.5&&!body)continue;
    if(ring<bestScore){best=e;bestScore=ring;}
  }
  return best;
}

// Enemy hit-testing supports a larger screen-space snap zone and the visible sprite.
function dragEnemyAtScreen(sx,sy){
  if(!RB||!RB.L||!PA)return null;
  let best=null,score=Infinity;
  const scale=RB.L.s||1;
  for(const e of RB.soldiers){
    if(!e.alive||!e.sq.active||e.team!=='red')continue;
    const p=P(e.x,e.z),m=PXU[e.type]?.meta;
    const rad=Math.max(26,2.7*scale);
    const w=m?m.cw*PA:26*PA,h=m?m.ch*PA:29*PA;
    const ax=m?m.ax*PA:w/2,ay=m?m.ay*PA:h;
    const left=p.x-ax-6,right=left+w+12,top=p.y-ay-6,bottom=top+h+12;
    const inside=sx>=left&&sx<=right&&sy>=top&&sy<=bottom;
    const dist=Math.hypot(sx-p.x,sy-p.y);
    if(!inside&&dist>rad)continue;
    const value=inside?dist/(rad*1.4):dist/rad;
    if(value<score){best=e;score=value;}
  }
  return best;
}

function issueAttackOrder(q,enemy){

  if(q.type==='hoplite'&&q.shield)formShield(q,false);

function mapTap(cx,cy){
  if(!(G.phase==='muster'||G.phase==='player'))return;
  const t=mapPick(cx,cy);
  if(!t){G.sel=null;G.buy=null;mapLockedId=null;mapHoverId=null;mapRouteCursor();msg('');ui();return;}
  if(G.buy){
    if(t.owner!=='blue'){msg('Place units in your own (blue) territories.');return;}
    const c=U[G.buy].cost;if(G.coins.blue<c){G.buy=null;msg('Out of coins.');ui();return;}
    const ty=G.buy;G.coins.blue-=c;t.units[ty]++;if(G.coins.blue<c){G.buy=null;}
    msg(`${U[ty].name} placed in ${t.name}.${G.buy?' Tap again to add more.':''}`);ui();return;
  }
  if(G.phase==='muster'){msg('Pick a unit card first, then tap your territory.');return;}
  if(G.sel===null){
    if(t.owner!=='blue'){msg(`${t.name}: ${describe(t)}${cnt(t)?` — ${armyHP(t.units)} HP · ${armyATK(t.units)} ATK`:''}`);return;}
    if(!cnt(t)){msg(`${t.name} has no army to move.`);return;}
    if(t.acted){msg(`The army in ${t.name} has already moved this turn.`);return;}
    G.sel=t.i;mapHoverId=null;mapLockedId=null;mapRouteCursor();
    msg(`Army of ${t.name} selected. Choose a neighboring city to decide which units march and which stay behind.`);return;
  }
  const from=T[G.sel];
  if(t===from){G.sel=null;mapHoverId=null;mapLockedId=null;mapRouteCursor();msg('');return;}
  if(!adj(from,t)){
    if(t.owner==='blue'&&cnt(t)&&!t.acted){G.sel=t.i;mapLockedId=null;mapHoverId=null;mapRouteCursor();msg(`Army of ${t.name} selected. Pick a neighboring city to split the army before moving.`);}
    else msg('You can only move to a neighboring territory.');return;
  }
  // Like Risk's Move Troops screen: choose exactly which soldiers travel.
  // Works for an attack, an unguarded capture, or movement to a friendly city.
  mapLockedId=t.i;mapHoverId=t.i;mapRouteCursor();
  openArmyDeployment(from,t);return;
}
function describe(t){const p=TYPES.filter(k=>t.units[k]).map(k=>`${t.units[k]} ${U[k].name.toLowerCase()}${t.units[k]>1?'s':''}`);return p.length?p.join(', '):'unguarded';}

function startPlayerTurn(first){
  T.forEach(t=>t.acted=false);
  if(!first){msg('New turn. Recruit with coins from the Mines, or tap an army to move or attack.');}
  else msg('Select an army and a neighboring city. Choose who marches and who stays behind before fighting or moving.');
  mapHoverId=null;mapLockedId=null;mapRouteCursor();G.phase='player';ui();
}

/* catapults: every shot is a geometry question */
function catapultTarget(q,from){const c=from||center(q);if(!c)return null;const Rg=RNG.catapult;
  const inR=(x,z)=>Math.hypot(x-c.x,z-c.z)<=Rg;

    const idx=BREACH.find(i=>!RB.segs[i].gone);if(RB.hits<2&&idx!==undefined){const g=RB.segs[idx];const z=(g.z0+g.z1)/2;if(inR(WALLX,z))return{kind:'wall',x:WALLX,z,idx};}}
  const foes=aliveOf(q.side==='atk'?'def':'atk');let nb=null,bd=Rg;foes.forEach(f=>{const d=dist(c,f);if(d<=bd){bd=d;nb=f;}});

function fireCatapult(q,hit,tg,landing=null){

    s.tf=screenDir(tg.x-s.x,tg.z-s.z);s.face=s.tf;s.anim='attack';s.at=bt();
    const delay=.11+Math.min(i,5)*.075;
    RB.proj.push({kind:'rock',source:s,volley:q.id,x0:s.x,z0:s.z,x1:tx,z1:tz,t:-delay/duration,dur:duration,arc:16,onHit:()=>{

      sfx('boom');RB.fx.push({k:'ring',x:tx,z:tz,t:RB.t});
      for(let n=0;n<8;n++)RB.fx.push({k:'deb',x:tx,z:tz,t:RB.t,vx:(Math.random()-.5)*10,vy:5+Math.random()*6});
      RB.decals.push({x:tx,z:tz,r:1.5,a:.15});

        if(Math.abs(tx-WALLX)<2.7){
          if(RB.gate.hp>0&&Math.abs(tz-30)<2.8){damageGate(85);return;}

        }

        let d=8*(.8+.4*Math.random());if(e.side==='def'&&e.x>WALLX+.4)d*=1-wallProt();e.hp-=d;
        const dl=Math.hypot(e.x-tx,e.z-tz)||1;e.fl=RB.t;e.kx=(e.x-tx)/dl;e.kz=(e.z-tz)/dl;

    }});
  });

  if(q.team==='blue')msg(`${launchers.length} catapult rock${launchers.length===1?'':'s'} launched!`);
  return launchers.length;
}
// Explicit player targeting keeps movement and attacks independent.
function validAim(q,tg){
  const c=center(q);if(!c||!tg)return false;
  if(Math.hypot(tg.x-c.x,tg.z-c.z)>RNG[q.type])return false;
  if(tg.kind==='gate')return RB.gate.hp>0;
  if(tg.kind==='wall')return RB.segs[tg.idx]&&!RB.segs[tg.idx].gone;
  if(tg.kind==='troops')return !tg.unit||tg.unit.alive;
  return false;
}
function pickRangedTarget(q,w){
  const c=center(q);if(!c)return null;

  RB.soldiers.forEach(e=>{if(e.alive&&e.side!==q.side&&e.sq.active){const d=Math.hypot(e.x-w.x,e.z-w.z);if(d<fd){fd=d;foe=e;}}});
  if(foe)return {kind:'troops',x:foe.x,z:foe.z,unit:foe};

    if(Math.abs(w.x-WALLX)<5){let bi=-1,bd=1e9;RB.segs.forEach((g,i)=>{if(g.gone)return;const dz=Math.max(g.z0,Math.min(g.z1,w.z));const d=Math.abs(dz-w.z)+Math.abs(w.x-WALLX)*.2;if(d<bd){bd=d;bi=i;}});
      if(bi>=0&&bd<3.2){const g=RB.segs[bi];return{kind:'wall',x:WALLX,z:(g.z0+g.z1)/2,idx:bi};}}

// Selectable ranged objectives are enumerated from the same world-space range check as attacks.
function listViableTargets(q){
  if(!RB||!q||!['archer','catapult'].includes(q.type))return [];
  const result=[];

    const t={kind:'troops',x:e.x,z:e.z,unit:e};if(validAim(q,t))result.push(t);
  }});

async function playerFire(q,selectedTarget){
  if(!RB||RB.over||RB.paused)return;

  const tg=resolvedAim(selectedTarget),battle=RB;
  if(!validAim(q,tg)){msg('That target moved outside your range. Choose another target.');return;}
  // Pause battle movement while the player calculates; the question is the reload mechanic.
  const problem=mathAimProblem(q,tg);
  battle.paused=true;
  let result=null;
  try{result=await askMathAim(problem,`target: ${tg.kind==='gate'?'gate':tg.kind==='wall'?'wall':'enemy squad'}`);}
  finally{battle.paused=false;}
  if(RB!==battle||RB.over||!result)return;

/* update */
let lastT=0;
function rtUpdate(now){
  // Use wall-clock elapsed seconds for reloads, regardless of the tactical slow-motion effect.
  // Simulation movement remains capped for stability, but the countdown now means real seconds.
  const elapsed=Math.max(0,(now-(lastT||now))/1000);
  const raw=Math.min(.05,elapsed);lastT=now;
  if(!RB||RB.over||RB.paused)return;
  const ts=RB.sel?.35:1;const dt=raw*ts;RB.t+=dt;RB.ts=ts;
  RB.spawns=RB.spawns.filter(sp=>{if(RB.t>=sp.at){sp.q.active=true;if(sp.q.type==='hoplite'||sp.q.type==='cavalry')msg(`Red ${U[sp.q.type].name.toLowerCase()} incoming!`);return false;}return true;});
  RB.aiT-=dt;if(RB.aiT<=0){RB.aiT=.35;aiThink();}
  RB.squads.forEach(q=>{if(q.charge&&(!q.chargeTarget?.alive||q.soldiers.filter(s=>s.alive).every(s=>s.chargeSpent))){q.charge=false;q.chargeTarget=null;}
    if(q.enemyLock){
      const enemy=q.enemyLock;
      if(!enemy.alive||!enemy.sq.active){q.enemyLock=null;if(q.type==='archer')q.focus=null;}
      else if(q.team==='blue'){
        if(q.type==='hoplite'||q.type==='cavalry'){
          q.dest={x:enemy.x,z:enemy.z};q.mode='move';q.moving=true;q.disengage=false;
        }else if(q.type==='archer'){
          const c=center(q);
          if(c&&Math.hypot(c.x-enemy.x,c.z-enemy.z)>RNG.archer*.88){q.dest={x:enemy.x,z:enemy.z};q.mode='move';q.moving=true;q.disengage=false;}
          else if(q.mode==='move'&&!q.disengage){q.mode='hold';q.moving=false;}
        }else if(q.type==='catapult'){
          q.aim={kind:'troops',x:enemy.x,z:enemy.z,unit:enemy};
          const c=center(q),distance=c?Math.hypot(c.x-enemy.x,c.z-enemy.z):0;
          if(c&&distance>RNG.catapult*.9){
            const step=(distance-RNG.catapult*.83)/distance;
            q.dest={x:c.x+(enemy.x-c.x)*step,z:c.z+(enemy.z-c.z)*step};q.mode='move';q.moving=true;q.disengage=true;
          }else if(q.mode==='move'&&q.disengage){q.mode='hold';q.moving=false;q.disengage=false;}
        }
      }
    }
    if(q.fireCD>0)q.fireCD=Math.max(0,q.fireCD-elapsed);
    if(q.mode==='recover'){let full=true;q.soldiers.forEach(s=>{if(s.alive&&s.hp<s.max){s.hp=Math.min(s.max,s.hp+1.8*dt);full=false;if(Math.random()<dt*1.5)RB.heals.push({x:s.x,z:s.z,t:performance.now()});}});
      if(full){q.mode='hold';q.disengage=false;if(q.team==='blue')msg(`${U[q.type].name}s are back at full strength.`);}}});
  const live=RB.soldiers.filter(s=>s.alive&&s.sq.active);
  for(const s of live){if(RB.paused)break;soldierThink(s,dt,live);}if(RB.paused)return;separate(live);
  // Walk animation follows real progress over a short window rather than per-frame motion. Soldiers holding a
  // position are pushed about by their neighbours and by the pull back to their post; that wobble nets almost no
  // distance, so they stand still instead of marching in place. s.wd is the distance walked, which drives the stride.
  if(dt>0)live.forEach(s=>{
    if(s.px===undefined){s.px=s.x;s.pz=s.z;s.hx=s.x;s.hz=s.z;s.ht=RB.t;s.spd=0;s.walk=false;}
    if(s.walk)s.wd=(s.wd||0)+Math.hypot(s.x-s.px,s.z-s.pz);
    s.px=s.x;s.pz=s.z;
    const el=RB.t-s.ht;
    if(el>=.18){s.spd=Math.hypot(s.x-s.hx,s.z-s.hz)/el;
      s.walk=s.spd>SPD[s.type]*(s.walk?.26:.42);   // hysteresis, so it doesn't flicker at the threshold
      s.hx=s.x;s.hz=s.z;s.ht=RB.t;}});
  // Ballistic motion uses real-time elapsed seconds, not the .35x tactical slowdown while a squad is selected.
  RB.proj.forEach(p=>{p.t+=Math.min(.15,elapsed)/p.dur;if(p.t>=1&&!p.done){p.done=true;p.onHit();}});RB.proj=RB.proj.filter(p=>!p.done);
  RB.dust.forEach(d=>{d.r+=dt*1.6;d.a-=dt*.8;});RB.dust=RB.dust.filter(d=>d.a>0);
  RB.fx=RB.fx.filter(f=>RB.t-f.t<3);RB.decals.forEach(d=>{d.a-=dt*.006;});RB.decals=RB.decals.filter(d=>d.a>0);
  // end checks
  const a=aliveOf('atk').length+RB.spawns.filter(sp=>sp.q.side==='atk').reduce((n,sp)=>n+sp.q.soldiers.length,0),d=aliveOf('def').length;

}

/* input */
function rtTap(sx,sy,forceMove=false){
  if(!RB||RB.over||RB.paused)return;
  // Targeting clicks take precedence over any overlapping sprite or flag.
  if(!forceMove&&RB.sel&&rangedTargetMode){
    const highlighted=targetedAtScreen(RB.sel,sx,sy);
    if(highlighted){orderRangedTarget(RB.sel,highlighted);return;}
  }
  if(!forceMove&&RB.sel?.chargeArmed&&RB.sel.type==='cavalry'){
    const foe=chargedEnemyAtScreen(sx,sy);
    if(foe){startCharge(RB.sel,foe);RB.sel.chargeArmed=false;hoverCharge=null;moveOrderArmed=false;syncBattleCursor();updateChips(true);msg('Cavalry charging the selected enemy!');return;}
  }
  // A squad selected via its bottom card is explicitly awaiting a destination.
  // This takes precedence even when other friendly sprites overlap that location.
  if(moveOrderArmed&&RB.sel){
    const foe=dragEnemyAtScreen(sx,sy);
    if(foe){issueAttackOrder(RB.sel,foe);return;}
    const w=unP(sx,sy),dest=planMoveDestination(w.x,w.z);
    if(dest)issueMoveOrder(RB.sel,dest);
    return;
  }
  // Direct sprite clicks still select without issuing accidental moves.
  if(!forceMove){
    const hitQ=friendlySquadAtScreen(sx,sy);
    if(hitQ){selectSquadDirect(hitQ);return;}
  }
  const w=unP(sx,sy);
  if(!RB.sel)return;
  if(!forceMove&&RB.sel?.chargeArmed){
    RB.sel.chargeArmed=false;hoverCharge=null;syncBattleCursor();refreshActions();msg('Charge canceled. Select another enemy or choose Move.');return;
  }
  if(!forceMove&&rangedTargetMode){
    if(fireAimMode){cancelFireAim();return;}
    rangedTargetMode=false;hoverAim=null;syncBattleCursor();updateChips(true);
    msg('Targeting canceled. Drag from the squad to reposition it.');return;
  }
  if(!forceMove&&!moveOrderArmed){
    msg('Click a friendly unit to select it, then drag to set its destination.');return;
  }
  const dest=planMoveDestination(w.x,w.z);
  if(!dest){moveOrderArmed=false;refreshActions();return;}
  issueMoveOrder(RB.sel,dest);
}

/* battle entry */
async function runBattle(atkT,defT,atkTeam,selectedTroops=null){
  // The attacking expedition is separate from the units defending its home city.
  // AI and Quick Battle use the entire army unless explicit units are selected.
  const expedition={};const homeGarrison={};
  TYPES.forEach(k=>{
    const available=Math.max(0,Math.floor(atkT.units[k]||0));
    const requested=selectedTroops?Math.floor(Number(selectedTroops[k])||0):available;
    expedition[k]=Math.max(0,Math.min(available,requested));
    homeGarrison[k]=available-expedition[k];
  });
  if(!TYPES.some(k=>expedition[k]>0))return;
  atkT.acted=true;
  if(!cnt(defT)){
    TYPES.forEach(k=>{defT.units[k]=expedition[k];atkT.units[k]=homeGarrison[k];});
    defT.owner=atkTeam;defT.acted=true;
    msg(`${defT.name} captured! ${cnt(atkT)} soldiers remain in ${atkT.name}.`);ui();checkEnd();return;
  }

/* ---------- AI ---------- */
function frontline(team){return T.filter(t=>t.owner===team&&T.some(o=>adj(t,o)&&o.owner!==team));}
function aiBuy(){
  const fl=frontline('red');const pool=fl.length?fl:T.filter(t=>t.owner==='red');if(!pool.length)return;
  let guard=0;while(G.coins.red>=10&&guard++<40){
    const r=Math.random();let ty=r<.45?'hoplite':r<.65?'archer':r<.85?'cavalry':'catapult';
    if(G.coins.red<U[ty].cost)ty='hoplite';if(G.coins.red<U[ty].cost)break;
    pool.sort((a,b)=>strength(a.units)-strength(b.units));const t=ty==='catapult'?pool[pool.length-1]:pool[0];
    t.units[ty]++;G.coins.red-=U[ty].cost;}
}
async function enemyTurn(){
  G.phase='enemy';ui();msg('Red is mustering…');
  T.forEach(t=>t.acted=false);
  G.coins.red+=15+5*T.filter(t=>t.owner==='red').length;aiBuy();await sleep(900);
  let actions=0;
  for(const t of T.filter(t=>t.owner==='red')){
    if(actions>=2||G.phase==='over')break;if(t.acted||!cnt(t))continue;
    const targets=T.filter(o=>adj(t,o)&&o.owner!=='red');if(!targets.length)continue;
    targets.sort((a,b)=>strength(a.units)-strength(b.units));const tg=targets[0];
    if(tg.owner==='none'&&cnt(t)>=3){TYPES.forEach(k=>{const m=Math.floor(t.units[k]/2);tg.units[k]+=m;t.units[k]-=m;});if(!cnt(tg)){tg.units.hoplite=1;t.units.hoplite=Math.max(0,t.units.hoplite-1);}tg.owner='red';tg.acted=true;msg(`Red marches into ${tg.name}.`);await sleep(900);actions++;continue;}
    if(tg.owner==='blue'){const exp=Math.round(Math.min(2,t.units.catapult)*.6);if(!cnt(tg)||odds(t.units,tg.units,exp,200)>=.6){await runBattle(t,tg,'red');actions++;}}
  }
  if(G.phase==='over')return;
  if(!actions){msg('Red holds its lines.');await sleep(800);}
  G.round++;
  if(G.round>MAX_ROUNDS){finish();return;}
  startPlayerTurn(false);
}

/* ---------- end ---------- */
function checkEnd(){const b=T.filter(t=>t.owner==='blue').length,r=T.filter(t=>t.owner==='red').length;if(!b||!r)finish();}
function finish(){
  G.phase='over';ui();
  const b=T.filter(t=>t.owner==='blue').length,r=T.filter(t=>t.owner==='red').length;
  const win=b>r;const tie=b===r;
  const sum=team=>T.filter(t=>t.owner===team).reduce((s,t)=>s+valueOf(t.units),0);
  const loot=Math.round((win?sum('red'):tie?0:sum('blue'))*.5);
  panel(`<div class="kicker">After ${Math.min(G.round,MAX_ROUNDS)} rounds</div><h2>${tie?'Stalemate':win?'Greece is yours':'Red wins the war'}</h2>
  <p>Territories — Blue: <b>${b}</b> · Red: <b>${r}</b></p>
  ${tie?'':`<p>${win?'You':'Red'} loot ${loot} coins (half the value of the loser's remaining units).</p>`}
  <button id="again" style="width:100%;margin-top:8px">Play again</button>`);
  $('again').onclick=()=>{closePanel();savePlayer(false);setup();G.phase='muster';msg('New Greek campaign. Earn more coins in the Mines whenever you need reinforcements.');ui();};
}

function queueCloudSave(){
  if(!cloudReady||cloud.blocked||!activeUser)return;
  const snapshot=JSON.stringify(cloudData());
  if(snapshot===cloud.lastSaved&&!cloud.busy){cloud.dirty=false;setCloudStatus('saved');return;}
  cloud.dirty=true;setCloudStatus(cloud.busy?'saving':'pending');
  clearTimeout(cloud.timer);cloud.timer=setTimeout(sendCloudSave,700);
}
function sendCloudSave(){
  if(!cloudReady||cloud.blocked||cloud.busy||!cloud.dirty||!activeUser)return;
  const data=cloudData(),snapshot=JSON.stringify(data);
  if(snapshot===cloud.lastSaved){cloud.dirty=false;setCloudStatus('saved');return;}
  cloud.dirty=false;cloud.busy=true;setCloudStatus('saving');
  google.script.run.withSuccessHandler(result=>{
    cloud.busy=false;
    if(!result?.ok){
      cloud.blocked=true;setCloudStatus(result?.conflict?'conflict':'error',result?.message||'Save was rejected');return;
    }
    cloud.revision=result.revision;cloud.lastSaved=snapshot;
    if(cloud.dirty||JSON.stringify(cloudData())!==snapshot){cloud.dirty=true;sendCloudSave();}
    else setCloudStatus('saved');
  }).withFailureHandler(err=>{cloud.busy=false;cloud.dirty=true;setCloudStatus('error',err?.message||'Network error; press Retry Save');})
    .saveStudentProfile({revision:cloud.revision,profile:data});
}
function retryCloudSave(){
  if(cloud.blocked){if(confirm('There is a newer online save. Reload this page to load it? Unsaved changes in this tab will be lost.'))location.reload();return;}
  cloud.dirty=true;sendCloudSave();
}

function spawnMineCoins(payout){
  const host=$('minePlay'),counter=$('mineCoins'),stage=$('mineStage');
  if(!host||!counter||!stage||!host.isConnected)return;
  const frame=host.getBoundingClientRect();
  const source=(stage.querySelector('.mine-answer-row')||stage).getBoundingClientRect();
  const destination=counter.getBoundingClientRect();
  const sx=source.left+source.width*.5-frame.left,sy=source.top+source.height*.5-frame.top;
  const tx=destination.left+destination.width*.5-frame.left,ty=destination.top+destination.height*.5-frame.top;
  for(let i=0;i<Math.min(10,Math.max(5,Math.round(payout/2)));i++){
    const coin=document.createElement('span');coin.className='coin-fly';
    const ox=(Math.random()-.5)*34,oy=(Math.random()-.5)*18;
    coin.style.left=(sx+ox-9)+'px';coin.style.top=(sy+oy-9)+'px';host.appendChild(coin);
    requestAnimationFrame(()=>{coin.style.transform=`translate(${tx-sx-ox}px,${ty-sy-oy}px) scale(.5)`;coin.style.opacity='0';});
    setTimeout(()=>coin.remove(),850);
  }
  const pop=document.createElement('span');pop.className='coin-gain';pop.textContent='+'+payout+' COINS';pop.style.left=sx+'px';pop.style.top=(sy-25)+'px';host.appendChild(pop);setTimeout(()=>pop.remove(),1000);
  for(const el of [counter,$('mineEarned'),$('hubWallet')]){if(el){el.classList.remove('coin-bump');void el.offsetWidth;el.classList.add('coin-bump');}}
}

function mineTimerTick(now){
  if(!mine.active||mine.locked||hubView!=='mine'||!mine.question||mine.help)return;

  mine.remaining=bonusRemaining;
  const fill=$('mineTimeFill'),label=$('mineTimeText'),flag=$('mineHelpFlag');
  if(fill)fill.style.width=`${(bonusRemaining/MINE_SPEED_BONUS_SECONDS*100).toFixed(1)}%`;
  if(label)label.textContent=bonusRemaining>0?`${bonusRemaining.toFixed(1)}s · SPEED BONUS TIMER`:'SPEED BONUS ENDED · KEEP ANSWERING';
  if(flag){
    const available=bonusRemaining>0;
    flag.textContent=available?'+10 COINS IF CORRECT BEFORE ZERO':'BASE COINS + STREAK STILL AVAILABLE';
    flag.className=available?'mine-speed-live':'mine-speed-ended';
  }
}
function submitMiningAnswer(){

    mine.streak++;mine.correct++;mine.sessionBest=Math.max(mine.sessionBest,mine.streak);

    activeUser.totalMined=(activeUser.totalMined||0)+payout;activeUser.totalCorrect=(activeUser.totalCorrect||0)+1;
